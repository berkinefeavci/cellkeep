name: Build

# This targets the public repo layout: Sources/, Tests/, check.sh, and build.sh
# live at the repo root (the former `project/` contents), not under a `project/` folder.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          # Cellkeep is developed against Xcode 27, but hosted runners may still ship an older
          # Xcode. We pick the newest one available. On an older Xcode, build.sh skips the
          # asset-catalog and App Intents packaging steps under CI (see ci_optional there), so
          # this job then proves compile + tests only, not a release-complete .app. That is
          # flagged as a warning below instead of passing silently.
          # See: https://github.com/actions/runner-images for the Xcode versions on macos-latest.
          latest_xcode="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$latest_xcode" ]; then
            echo "No Xcode installation found on this runner." >&2
            exit 1
          fi
          echo "Selecting: $latest_xcode"
          sudo xcode-select -s "$latest_xcode/Contents/Developer"
          xcodebuild -version
          xcode_major="$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')"
          if [ "${xcode_major:-0}" -lt 27 ]; then
            message="Runner has Xcode $xcode_major, not 27: Assets.car and App Intents metadata are not packaged; this run checks compile + tests only."
            echo "::warning title=Older Xcode on runner::$message"
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> $message" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run checks
        run: ./check.sh

      - name: Build
        run: ./build.sh
